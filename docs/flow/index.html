<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="data:,">

</head>
<body>
<header class="top">
  <div class="topbar">
    <a class="brand" href="../">MII Lab</a>
    <nav class="tabs" aria-label="Live dashboards">
      <a class="tab" href="../live/"><span class="t-long">Fear meter</span><span class="t-short">Fear</span></a>
      <a class="tab" href="../breadth/"><span class="t-long">Breadth</span><span class="t-short">Breadth</span></a>
      <a class="tab" href="../eagle-eye/"><span class="t-long">Eagle Eye Technicals</span><span class="t-short">Eagle</span></a>
      <a class="tab" href="./" aria-current="page"><span class="t-long">Flow Dashboard</span><span class="t-short">Flow</span></a>
      <a class="tab" href="../gex-hunt/"><span class="t-long">GEX Hunt</span><span class="t-short">Hunt</span></a>
      <a class="tab" href="../index-flow/"><span class="t-long">Index Flow</span><span class="t-short">Index</span></a>
      <a class="tab" href="../sector-rotation/"><span class="t-long">Sector Rotation</span><span class="t-short">Rotation</span></a>
      <a class="tab" href="../"><span class="t-long">All dashboards</span><span class="t-short">All</span></a>
    </nav>
  </div>
</header>
<div id="bar">
  <span id="brand" title="Flow Dashboard: whale / retail chips, dark pool, short ratio and short interest under the Eagle Eye chart">FLOW</span>
  <span id="symwrap"><input id="symin" spellcheck="false" autocomplete="off" autocapitalize="characters" aria-label="Ticker" title="Ticker: type to search (or just start typing anywhere)"><div id="symlist" hidden></div></span>
  <span id="tfs"></span>
  <span id="layerwrap"><button id="layerbtn" title="Show / hide chart layers">Layers ▾</button><div id="layers" hidden></div></span>
  <span id="status"><span id="dot"></span><span id="stxt">loading…</span></span>
</div>
<div id="head">
  <span class="t"><span id="symname"></span> · <span id="tfname"></span><span id="exch"></span></span>
  <span class="ohlc" id="ohlc"></span>
  <span class="ind" id="ind"></span>
</div>
<div id="main">
  <div id="chartbox">
    <canvas id="under"></canvas>
    <div id="chart"></div>
    <div id="dchart"></div>
    <canvas id="overlay"></canvas>
    <div id="cards"></div>
    <table id="gex" title="click to collapse"><tbody id="gexb"></tbody></table>
    <div id="maxbtns"></div>
    <div id="hsplit" title="Drag to resize the price chart vs the panels"></div>
    <div id="empty" hidden></div>
  </div>
  <div id="vsplit" title="Drag to resize the side box"></div>
  <div id="side">
    <div id="sidemax" class="maxbtn" title="Expand the table (or double-click it)">⤢</div>
    <table id="ditable"><tbody id="ditb"></tbody></table>
    <div id="difoot"></div>
    <div id="episode" style="display:none"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js" integrity="sha384-KkYqTZlM13Zya6fVUF3IGCBOQ1ehFeJVVgxaVvD/0MebineF9EI8Jkd3NnWNChqN" crossorigin="anonymous"></script>
<script src="flow.js?v=20261021flw"></script>
<script src="app.js?v=20261021flw"></script>
<script src="sizing.js?v=20261021flw"></script>
<script src="symbols.js?v=20261021flw"></script>
<script src="darkpool.js?v=20261021flw"></script>
<script src="app_ui.js?v=20261021flw"></script>
</body>
