  <div class="topbar">
    <a class="brand" href="../">MII Lab</a>
    <nav class="tabs" aria-label="Live dashboards">

  <button id="pileBtn" class="chip" title="Highest-ranked call and put skews, paired with their biggest positive-GEX piles"><svg width="12" height="11" viewBox="0 0 12 11"><rect x="0" y="7" width="12" height="3.2" rx="1" fill="#f5d63d"/><rect x="1.5" y="3.5" width="9" height="3.2" rx="1" fill="#f5d63d" opacity=".75"/><rect x="3.5" y="0" width="5" height="3.2" rx="1" fill="#f5d63d" opacity=".5"/></svg>Skew × Pile</button>

  <span id="chips"></span>
  <button id="movedBtn" class="chip" hidden></button>
  <span id="status"><b></b><span></span></span>
</div>
<div id="moved" hidden></div>
<main id="app"><div class="empty">Loading…</div></main>
