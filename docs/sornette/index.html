<script>



(function () {
  var f = window.fetch.bind(window), MAX = 4, STALL = 8000, SLOW_AFTER = 4000, MIN_RATE = 16 * 1024, STRICT_TRIES = 3,
    TRIES = 10, active = 0, queue = [], NULL_BODY = [101, 204, 205, 304];
  function pump() {
    while (active < MAX && queue.length) { var job = queue.shift(); active++; job().then(done, done); }
  }
  function done() { active--; pump(); }
  function attempt(input, init, strict) {
    var ctl = new AbortController(), outer = init && init.signal, start = Date.now(), last = start, bytes = 0;
    var dog = setInterval(function () {
      var now = Date.now();
      if (now - last > STALL || (strict && now - start > SLOW_AFTER && bytes * 1000 / (now - start) < MIN_RATE)) ctl.abort();
    }, 500);
    function onOuter() { ctl.abort(); }
    if (outer) outer.addEventListener('abort', onOuter);
    return f(input, Object.assign({}, init || {}, {signal: ctl.signal})).then(function (r) {
      last = Date.now();
      if (!r.body || NULL_BODY.indexOf(r.status) >= 0) return {r: r, body: null};
      var reader = r.body.getReader(), parts = [];
      function pull() {
        return reader.read().then(function (x) {
          if (x.done) return;
          parts.push(x.value); bytes += x.value.length; last = Date.now();
          return pull();
        });
      }
      return pull().then(function () {
        var body = new Uint8Array(bytes), o = 0;
        parts.forEach(function (p) { body.set(p, o); o += p.length; });
        return {r: r, body: body};
      });
    }).finally(function () { clearInterval(dog); if (outer) outer.removeEventListener('abort', onOuter); });
  }
  function run(input, init, n) {
    var outer = init && init.signal;
    if (outer && outer.aborted) return Promise.reject(outer.reason);
    return attempt(input, init, n < STRICT_TRIES).then(function (x) {
      return new Response(x.body, {status: x.r.status, statusText: x.r.statusText, headers: x.r.headers});
    }, function (e) {
      if (outer && outer.aborted) throw outer.reason;
      if (n >= TRIES) throw e;
      return new Promise(function (r) { setTimeout(r, Math.min(2000, 300 * (n + 1))); }).then(function () { return run(input, init, n + 1); });
    });
  }
  window.fetch = function (input, init) {
    return new Promise(function (resolve, reject) {
      queue.push(function () { var p = run(input, init, 0); p.then(resolve, reject); return p; });
      pump();
    });
  };
})();
</script>
